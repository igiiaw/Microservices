services:
  # ── Order Database ────────────────────────────────────────────────────────
  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # exposed on 5433 so it doesn't clash with a local PG
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Payment Database ──────────────────────────────────────────────────────
  payments-db:
    image: postgres:15-alpine
    container_name: payments-db
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"   # separate port – separate database, separate ownership
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Payment Service ───────────────────────────────────────────────────────
  # Started before order-service so the inter-service HTTP call can succeed.
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: payments-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: payments_db
      PORT: 8081
    depends_on:
      payments-db:
        condition: service_healthy
    restart: on-failure

  # ── Order Service ─────────────────────────────────────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: orders-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: orders_db
      PAYMENT_SERVICE_URL: http://payment-service:8081
      PORT: 8080
    depends_on:
      orders-db:
        condition: service_healthy
      payment-service:
        condition: service_started
    restart: on-failure

volumes:
  orders_db_data:
  payments_db_data:
